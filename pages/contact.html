<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Lionel Nagueu Djambong</title>
<meta name="description" content="Portfolio de Lionel Nagueu Djambong, Data Analyst et Analytics Engineer : projets Power BI, DBT, SQL, Python, snowflake et Databricks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-root="../" data-page="contact">
<div id="site-header"></div>
<main class="page"><div class="container w-def"><div class="head"><div><p class="eyebrow">Contact</p><h1>Travaillons ensemble</h1><p class="sub">Un projet, une mission ou une question ? Écrivez-moi, je réponds sous 48 h.</p></div></div><div class="row g-5">
<div class="col-lg-5"><p class="mb-2"><i class="bi bi-envelope me-2" style="color:var(--ac)"></i><a id="c-mail" href="#"></a></p><p class="mb-2"><i class="bi bi-geo-alt me-2" style="color:var(--ac)"></i><span id="c-loc"></span></p></div>
<div class="col-lg-7"><form class="needs-validation" id="form" novalidate><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="nom">Nom</label><input class="form-control" id="nom" required minlength="2"><div class="invalid-feedback">Indiquez votre nom.</div></div>
<div class="col-md-6"><label class="form-label" for="mail">E-mail</label><input type="email" class="form-control" id="mail" required><div class="invalid-feedback">Indiquez une adresse e-mail valide.</div></div>
<div class="col-12"><label class="form-label" for="msg">Message</label><textarea class="form-control" id="msg" rows="5" required minlength="10"></textarea><div class="invalid-feedback">Votre message doit faire au moins 10 caractères.</div></div>
<div class="col-12"><button class="btn btn-ac" type="submit">Envoyer le message</button><span class="ms-3 text-success d-none" id="ok">Votre messagerie s’ouvre avec le message prêt à envoyer.</span></div>
</div></form></div></div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../components/header.js"></script>
<script src="../components/footer.js"></script>
<script src="../components/animations.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
